<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günaydın Eylülüm 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .main-message {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            animation: fadeInDown 1s ease;
            position: relative;
            overflow: hidden;
        }

        .main-message::before {
            content: '💕';
            position: absolute;
            font-size: 150px;
            opacity: 0.05;
            top: -30px;
            right: -30px;
            animation: float 3s ease-in-out infinite;
        }

        .main-message h1 {
            color: #e63946;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(230, 57, 70, 0.2);
        }

        .main-message .name {
            color: #d62828;
            font-size: 1.2em;
            font-weight: bold;
        }

        .daily-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 30px;
            border-radius: 20px;
            font-size: 1.3em;
            line-height: 1.8;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.3);
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1s ease;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            color: #e63946;
            font-size: 2em;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-preview {
            text-align: center;
            padding: 20px;
        }

        .quiz-button {
            display: inline-block;
            background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.3em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.3);
        }

        .quiz-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(230, 57, 70, 0.5);
        }

        .quiz-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .gallery-preview {
            background: linear-gradient(135deg, #ffd6d6 0%, #ffb3b3 100%);
            padding: 60px;
            text-align: center;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .gallery-preview::before {
            content: '🖼️';
            position: absolute;
            font-size: 120px;
            opacity: 0.1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .gallery-preview h3 {
            color: #d62828;
            font-size: 2em;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .gallery-preview p {
            color: #e63946;
            font-size: 1.3em;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .heart {
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .falling-heart {
            position: absolute;
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .date-display {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .music-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.4);
            transition: all 0.3s ease;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(230, 57, 70, 0.6);
        }

        .music-button:active {
            transform: scale(0.95);
        }

        .music-button.playing {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(230, 57, 70, 0.4);
            }
            50% {
                box-shadow: 0 10px 40px rgba(230, 57, 70, 0.8);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px 5px;
            }

            .container {
                padding: 0 5px;
            }

            .main-message {
                padding: 20px 15px;
                border-radius: 15px;
                margin-bottom: 15px;
            }

            .main-message::before {
                font-size: 60px;
                top: -5px;
                right: -5px;
            }

            .main-message h1 {
                font-size: 1.5em;
                margin-bottom: 10px;
                line-height: 1.3;
            }

            .main-message .name {
                font-size: 0.9em;
                display: block;
                margin-top: 5px;
            }

            .daily-message {
                font-size: 0.9em;
                padding: 15px;
                line-height: 1.5;
                margin-top: 12px;
            }

            .card {
                padding: 15px;
                margin-bottom: 15px;
                border-radius: 15px;
            }

            .card-title {
                font-size: 1.2em;
                margin-bottom: 10px;
                flex-wrap: wrap;
            }

            .gallery-preview {
                padding: 30px 15px;
            }

            .gallery-preview::before {
                font-size: 60px;
            }

            .gallery-preview h3 {
                font-size: 1.3em;
                margin-bottom: 10px;
            }

            .gallery-preview p {
                font-size: 0.95em;
            }

            .date-display {
                font-size: 0.9em;
                margin-bottom: 12px;
                padding: 0 10px;
            }

            .music-button {
                width: 55px;
                height: 55px;
                font-size: 1.6em;
                bottom: 15px;
                right: 15px;
            }

            .falling-heart {
                font-size: 14px;
            }

            .quiz-button {
                font-size: 1.1em;
                padding: 15px 35px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-container" id="heartsContainer"></div>
    
    <button class="music-button" id="musicButton" title="Müziği Aç/Kapat">
        🎵
    </button>

    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_4e8f6a0905.mp3" type="audio/mpeg">
    </audio>
    
    <div class="container">
        <div class="main-message">
            <h1>Günaydın <span class="name">Eylülüm</span> <span class="heart">💕</span></h1>
            <div class="daily-message" id="dailyMessage"></div>
        </div>

        <div class="card">
            <h2 class="card-title"><span class="heart">❓</span> Merak Edilen Aşikar Sorular</h2>
            <div class="quiz-preview">
                <p style="color: #555; font-size: 1.1em; margin-bottom: 25px; line-height: 1.6;">
                    Beni ne kadar tanıyorsun? Aşikar sorulara cevap verebilir misin? 💕
                </p>
                <a href="sorular.html" class="quiz-button">
                    Soruları Çöz 🎯
                </a>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title"><span class="heart">📸</span> Fotoğraf Galerimiz</h2>
            <div class="gallery-preview">
                <h3>Çok Yakında...</h3>
                <p>En güzel anılarımızı burada toplamak için sabırsızlanıyorum 💝</p>
            </div>
        </div>
    </div>

    <script>
        const messages = [
            "Günaydın aşkım! Uyanır uyanmaz aklıma gelen ilk şey sensin. Bugün de harika geçsin! 💕",
            "Sabah güneşi bile senin kadar aydınlatamaz hayatımı. Günaydın tatlım! ☀️",
            "Her sabah seni düşünerek uyanmak, en güzel hediye. Günaydın canım! 💖",
            "Kahvem kadar sıcak, kalbin kadar güzel bir sabah dilerim sana. Günaydın! ☕",
            "Rüyalarımın kahramanı, gerçek hayatımın aşkı... Günaydın Eylülüm! 🌙",
            "Bugün de yanımda olmasan da kalbimdesin. İyi sabahlar güzelim! 💝",
            "Sabah kuşları bile senin kadar güzel ötmez. Günaydın aşkım! 🐦",
            "Her yeni gün, seni daha çok sevmem için bir fırsat. Günaydın! 💗",
            "Uyanmak güzel, ama senin için uyanmak daha da güzel. İyi sabahlar! 🌺",
            "Gözlerini açtığın her sabah dünya daha güzel oluyor. Günaydın tatlım! 👀",
            "Sevgim senin için her sabah daha da büyüyor. Günaydın canım! 💕",
            "Kahvaltıdan önce seni düşünmek, günün en güzel başlangıcı. Günaydın! 🥐",
            "Sen uyandığında çiçekler açıyor, kuşlar şarkı söylüyor. Günaydın aşkım! 🌸",
            "Bugün de seninle başlamak isterdim ama mesajımla başlayalım. Günaydın! 📱",
            "Her sabah sana olan sevgimle uyanıyorum. İyi günler güzelim! 🌅",
            "Sabahın bu erken saatinde bile aklımdasın. Günaydın Eylülüm! 🌤️",
            "Dünyanın en şanslı insanıyım çünkü sen varsın. Günaydın aşkım! 🍀",
            "Bugün de muhteşem olacak, çünkü sen varsın. Günaydın canım! ✨",
            "Her sabah seni seçerdim, her gün seni seçiyorum. Günaydın! 💖",
            "Kahve içmeden önce seni düşünmek daha çok uyandırıyor beni. Günaydın! ☕",
            "Sabahın en güzel kısmı, senin varlığını bilmek. İyi günler! 🌞",
            "Her yeni gün, sana olan aşkımı gösterme şansı. Günaydın tatlım! 💝",
            "Sen olmadan güneş doğsa da ben aydınlanamam. Günaydın aşkım! 🌄",
            "Bugün de seni sevmeye devam edeceğim. Günaydın Eylülüm! 💗",
            "Gözlerini açtığın her sabah dünya şanslı hissediyor. Günaydın! 🌍",
            "Sabah uyanmak zor ama seni düşününce kolay oluyor. İyi günler! 😊",
            "Her sabah seninle başlasa ne güzel olurdu. Günaydın canım! 🥰",
            "Bugün de harika geçecek çünkü kalbim seninle. Günaydın! 💕",
            "Sabahın sıcaklığı senin sevgin kadar güzel. Günaydın aşkım! 🔥",
            "Her gün seni daha çok seviyorum. Günaydın meleğim! 👼"
        ];

        function showDailyMessage() {
            const today = new Date();
            const dayOfMonth = today.getDate();
            const messageIndex = (dayOfMonth - 1) % messages.length;
            document.getElementById('dailyMessage').textContent = messages[messageIndex];
        }

        function createFallingHeart() {
            const heartsContainer = document.getElementById('heartsContainer');
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.textContent = Math.random() > 0.5 ? '❤️' : '💕';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        window.addEventListener('load', () => {
            showDailyMessage();
            
            setInterval(createFallingHeart, 3000);
            
            for (let i = 0; i < 3; i++) {
                setTimeout(createFallingHeart, i * 1000);
            }
        });

        const musicButton = document.getElementById('musicButton');
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;

        musicButton.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                musicButton.textContent = '🎵';
                musicButton.classList.remove('playing');
                isPlaying = false;
            } else {
                bgMusic.play();
                musicButton.textContent = '🎶';
                musicButton.classList.add('playing');
                isPlaying = true;
            }
        });
    </script>
</body>
</html>
